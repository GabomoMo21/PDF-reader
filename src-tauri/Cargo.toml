[package]
name = "open-pdf-editor"
version = "0.4.0"
description = "A free local PDF editor"
authors = ["OpenPDF contributors"]
edition = "2021"

[lib]
name = "open_pdf_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
